[package]
name = "pi-activity-strip-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace]

[dependencies]
gtk4-layer-shell = "=0.8.1"
gtk4 = { version = "=0.11.4", features = ["v4_14"] }
libc = "=0.2.189"
relm4 = { version = "=0.11.0", default-features = false, features = ["macros", "gnome_42"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
