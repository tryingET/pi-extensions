name: Export exact main for ripwire must-fix review
on:
  push:
    branches: [work/context-packer-ripwire-bootstrap]
    paths: [.github/workflows/ripwire-mustfix-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2abdd14627da60985b03e396bbbf5f87708d7925
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable source increment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2abdd14627da60985b03e396bbbf5f87708d7925
          git branch review-export HEAD
          git bundle create "$RUNNER_TEMP/mustfix-main.bundle" review-export ^b0d3bff0eb80e0b2c52a58d58e90f75a49c837a0
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/mustfix-main.identity"
          sha256sum "$RUNNER_TEMP/mustfix-main.bundle" > "$RUNNER_TEMP/mustfix-main.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ripwire-mustfix-main-source
          path: ${{ runner.temp }}/mustfix-main.*
          retention-days: 14
