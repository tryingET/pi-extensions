name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_path: packages/pi-agent-interaction-canary
            install: true
          - package_path: packages/pi-agent-vent
            install: true
          - package_path: packages/pi-autonomous-session-control
            install: true
          - package_path: packages/pi-better-openai
            install: true
          - package_path: packages/pi-context-packer
            install: true
          - package_path: packages/pi-eval-kernel
            install: true
          - package_path: packages/pi-evalset-lab
            install: true
          - package_path: packages/pi-evidence-review
            install: true
          - package_path: packages/pi-little-helpers
            install: true
          - package_path: packages/pi-llamacpp
            install: true
          - package_path: packages/pi-mermaid
            install: true
          - package_path: packages/pi-modes
            install: true
          - package_path: packages/pi-provenance
            install: true
          - package_path: packages/pi-session-compaction
            install: true
          - package_path: packages/pi-session-insights
            install: true
          - package_path: packages/pi-snapshot-edit
            install: true
          - package_path: packages/pi-society-orchestrator
            install: true
          - package_path: packages/pi-telemetry
            install: true
          - package_path: packages/pi-workstation-inference-provider
            install: true
          - package_path: packages/pi-autoresearch
            install: true
          - package_path: packages/pi-interaction/pi-editor-registry
            install: true
          - package_path: packages/pi-interaction/pi-interaction
            install: true
          - package_path: packages/pi-interaction/pi-interaction-kit
            install: true
          - package_path: packages/pi-interaction/pi-runtime-registry
            install: true
          - package_path: packages/pi-interaction/pi-trigger-adapter
            install: true
          - package_path: packages/pi-multi-pass
            install: true
          - package_path: packages/pi-prompt-inject
            install: true
          - package_path: packages/pi-prompt-template-accelerator
            install: true
          - package_path: packages/pi-toolbox-discovery
            install: true
          - package_path: packages/pi-vault-client
            install: true
          - package_path: packages/pi-context-engineering
            install: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
      - name: Install governed npm client
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        if: matrix.install
        working-directory: ${{ matrix.package_path }}
        run: npm ci
      - name: Run package checks
        working-directory: ${{ matrix.package_path }}
        run: npm run check

  root-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
      - name: Install governed npm client
        run: npm install --global npm@12.0.2
      - name: Validate immutable workflow inputs
        run: node --test ./scripts/workflow-action-pins.test.mjs
      - name: Validate release component metadata
        run: node ./scripts/release-components.mjs validate
      - name: Test release component resolver
        run: node --test ./scripts/release-components.test.mjs
      - name: Test standalone extension generations
        run: node --test ./scripts/standalone-extension-generations.test.mjs
      - name: Test package corpus summary
        run: node --test ./scripts/package-corpus-summary.test.mjs
      - name: Test package quality gate entrypoints
        run: node --test ./scripts/package-quality-gate.test.mjs
      - name: Test package release-check fast paths
        run: node --test ./scripts/package-release-check.test.mjs
      - name: Test package migration ledger
        run: node --test ./scripts/package-migration-ledger.test.mjs
      - name: Check copied release-check drift
        run: node ./scripts/check-release-check-drift.mjs
      - name: Validate package release policy
        run: bash ./scripts/release-policy-check.sh
      - name: Enforce semantic commit subjects
        run: bash ./scripts/semantic-commit-check.sh
      - name: Check dashboard asset policy
        run: bash ./scripts/check-dashboard-assets.sh
      - name: Check duplicate extension basenames
        run: bash ./scripts/check-extension-basename-collisions.sh
      - name: Check forbidden external extension symlinks
        run: bash ./scripts/check-no-external-extension-symlinks.sh
      - name: Run monorepo quality gate
        run: bash ./scripts/monorepo-quality-gate.sh ci
