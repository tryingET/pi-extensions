name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Run quality gate (ci)
        # ROCS is workspace-owned and unavailable in this standalone GitHub checkout.
        # Package release contracts run in the dedicated release-check matrix with package deps.
        # Developer pre-push validation still runs both checks from the owning workspace.
        run: PI_SKIP_ROCS=1 PI_SKIP_PACKAGE_RELEASE_CONTRACTS=1 PI_SKIP_PACKAGES=1 npm run quality:ci
