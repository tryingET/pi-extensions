name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: Prepare governed npm runtime policy
        run: |
          governed_tmp="$RUNNER_TEMP/governed-runtime"
          governed_cache="$RUNNER_TEMP/governed-npm-cache"
          governed_npmrc="$RUNNER_TEMP/governed-runtime.npmrc"
          npm_global="$RUNNER_TEMP/npm-global"
          mkdir -p "$governed_tmp" "$governed_cache" "$npm_global"
          echo "TMPDIR=$governed_tmp" >> "$GITHUB_ENV"
          echo "GOVERNED_NPM_CACHE=$governed_cache" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$governed_npmrc" >> "$GITHUB_ENV"
          npm install --global --prefix "$npm_global" npm@12.0.2
          echo "$npm_global/bin" >> "$GITHUB_PATH"
          "$npm_global/bin/npm" --version

      - name: Validate immutable workflow inputs
        run: node --test ./scripts/workflow-action-pins.test.mjs

      - name: Install Dolt for governed deep-review canary
        run: |
          dolt_version="2.3.1"
          dolt_commit="b15770fe588268027d799c11356af0ce24ba882a"
          dolt_template_blob="b212efe0dcb5b8ac05ceeefad17a65f19a5f502b"
          template="$RUNNER_TEMP/install-dolt.template.sh"
          expected="$RUNNER_TEMP/install-dolt.expected.sh"
          installer="$RUNNER_TEMP/install-dolt.sh"
          curl -fsSL "https://raw.githubusercontent.com/dolthub/dolt/$dolt_commit/go/utils/publishrelease/install.sh" -o "$template"
          test "$(git hash-object "$template")" = "$dolt_template_blob"
          sed "s/__DOLT_VERSION__/$dolt_version/g" "$template" > "$expected"
          curl -fsSL "https://github.com/dolthub/dolt/releases/download/v$dolt_version/install.sh" -o "$installer"
          cmp "$expected" "$installer"
          sudo bash "$installer"
          dolt version | grep -F "$dolt_version"
          dolt config --global --set user.name "github-actions[bot]"
          dolt config --global --set user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create immutable CI worktree
        run: |
          runtime_root="$RUNNER_TEMP/pi-extensions-${GITHUB_SHA:0:8}"
          git worktree add --detach "$runtime_root" "$GITHUB_SHA"
          echo "GOVERNED_CI_ROOT=$runtime_root" >> "$GITHUB_ENV"

      - name: Enforce root dependency installation contract
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          node --test ./scripts/root-package-install-contract.test.mjs
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "Root package is dependency-free; no lockfile or install is required."
          fi

      - name: Run host compatibility mutation tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          node --test ./scripts/pi-host-compatibility-canary.test.mjs
          node --test ./scripts/pi-host-compatibility-canary.recovery.test.mjs

      - name: Materialize governed runtime canary dependencies
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          # npm derives the install cutoff from min-release-age in its internal
          # flat options. `npm config get before` reports only an explicitly
          # configured raw key, so the governed preflight proves the declared
          # relative policy and derives the exact cutoff used by npm effects.
          cat > "$NPM_CONFIG_USERCONFIG" <<EOF
          min-release-age=7
          min-release-age-exclude[]=@tryinget/*
          registry=https://registry.npmjs.org/
          offline=false
          prefer-offline=false
          force=false
          cache=$GOVERNED_NPM_CACHE
          EOF
          npm --version
          npm config get min-release-age
          npm config get min-release-age-exclude
          npm config get before
          node ./scripts/governed-deep-review-canary.mjs materialize \
            --source-root "$GOVERNED_CI_ROOT" \
            --expected-commit "$GITHUB_SHA"

      - name: Prepare root quality scratch
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          quality_tmp="$HOME/.pi/tmp/pi-extensions"
          mkdir -p "$quality_tmp"
          echo "PI_EXTENSIONS_TMPDIR=$quality_tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$quality_tmp" >> "$GITHUB_ENV"
          echo "TMP=$quality_tmp" >> "$GITHUB_ENV"
          echo "TEMP=$quality_tmp" >> "$GITHUB_ENV"

      - name: Run CI smoke contract
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: ./scripts/ci/smoke.sh

      - name: Validate root release and host metadata
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          node --test ./scripts/root-package-install-contract.test.mjs
          node ./scripts/release-components.mjs validate
          node ./scripts/pi-host-compatibility-canary.mjs validate

      - name: Run release component contract tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node --test ./scripts/release-components.test.mjs

      - name: Run npm pack JSON tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node --test ./scripts/npm-pack-json.test.mjs

      - name: Run extension generation tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node --test ./scripts/pi-extension-generations.test.mjs

      - name: Run package quality-gate tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node --test ./scripts/package-quality-gate.test.mjs

      - name: Run local package-link contract tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          unset PI_SKIP_PACKAGES
          node --test ./scripts/validate-local-package-links.test.mjs

      - name: Run root documentation-alignment tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node --test ./scripts/root-doc-alignment.test.mjs

      - name: Run governed deep-review canary tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: node ./scripts/governed-deep-review-canary.mjs test --source-root "$GOVERNED_CI_ROOT"
