name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Dolt for governed deep-review canary
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh -o "$RUNNER_TEMP/install-dolt.sh"
          sudo bash "$RUNNER_TEMP/install-dolt.sh"
          dolt config --global --set user.name "github-actions[bot]"
          dolt config --global --set user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dolt version

      - name: Create immutable CI worktree
        run: |
          runtime_root="$RUNNER_TEMP/pi-extensions-${GITHUB_SHA:0:8}"
          git worktree add --detach "$runtime_root" "$GITHUB_SHA"
          echo "GOVERNED_CI_ROOT=$runtime_root" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Materialize governed runtime canary dependencies
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: >-
          node ./scripts/governed-deep-review-canary.mjs materialize
          --source-root "$GOVERNED_CI_ROOT"
          --expected-commit "$GITHUB_SHA"

      - name: Run quality gate (ci)
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        # ROCS is workspace-owned and unavailable in this standalone GitHub checkout.
        # Package release contracts run in the dedicated release-check matrix with package deps.
        # Developer pre-push validation still runs both checks from the owning workspace.
        run: PI_SKIP_ROCS=1 PI_SKIP_PACKAGE_RELEASE_CONTRACTS=1 PI_SKIP_PACKAGES=1 npm run quality:ci
