name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install uv for ROCS validation
        run: |
          python -m pip install --disable-pip-version-check --prefix "$RUNNER_TEMP/uv" uv==0.11.14
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Run quality gate (ci)
        run: npm run quality:ci
