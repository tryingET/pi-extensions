name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install uv for ROCS validation
        run: |
          python -m pip install --disable-pip-version-check --prefix "$RUNNER_TEMP/uv" uv==0.11.14
          uv_bin="$(find "$RUNNER_TEMP/uv" -type f -name uv -perm -111 -print -quit)"
          test -n "$uv_bin"
          uv_dir="$(dirname "$uv_bin")"
          echo "$uv_dir" >> "$GITHUB_PATH"
          echo "UV_DIR=$uv_dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi

      - name: Run quality gate (ci)
        run: PATH="$UV_DIR:$PATH" npm run quality:ci
