name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Prepare governed npm runtime policy
        run: |
          governed_tmp="$RUNNER_TEMP/governed-runtime"
          governed_cache="$RUNNER_TEMP/governed-npm-cache"
          governed_npmrc="$RUNNER_TEMP/governed-runtime.npmrc"
          npm_global="$RUNNER_TEMP/npm-global"
          mkdir -p "$governed_tmp" "$governed_cache" "$npm_global"
          echo "TMPDIR=$governed_tmp" >> "$GITHUB_ENV"
          echo "GOVERNED_NPM_CACHE=$governed_cache" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_USERCONFIG=$governed_npmrc" >> "$GITHUB_ENV"
          npm install --global --prefix "$npm_global" npm@12.0.2
          echo "$npm_global/bin" >> "$GITHUB_PATH"
          "$npm_global/bin/npm" --version

      - name: Install Dolt for governed deep-review canary
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh -o "$RUNNER_TEMP/install-dolt.sh"
          sudo bash "$RUNNER_TEMP/install-dolt.sh"
          dolt config --global --set user.name "github-actions[bot]"
          dolt config --global --set user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dolt version

      - name: Create immutable CI worktree
        run: |
          runtime_root="$RUNNER_TEMP/pi-extensions-${GITHUB_SHA:0:8}"
          git worktree add --detach "$runtime_root" "$GITHUB_SHA"
          echo "GOVERNED_CI_ROOT=$runtime_root" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
            rm -f package-lock.json
          fi

      - name: Run host compatibility mutation tests
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          node --test ./scripts/pi-host-compatibility-canary.test.mjs
          node --test ./scripts/pi-host-compatibility-canary.recovery.test.mjs

      - name: Materialize governed runtime canary dependencies
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        run: |
          # npm derives the install cutoff from min-release-age in its internal
          # flat options. `npm config get before` reports only an explicitly
          # configured raw key, so the governed preflight proves the declared
          # relative policy and derives the exact cutoff used by npm effects.
          cat > "$NPM_CONFIG_USERCONFIG" <<EOF
          min-release-age=7
          min-release-age-exclude[]=@tryinget/*
          registry=https://registry.npmjs.org/
          offline=false
          prefer-offline=false
          force=false
          cache=$GOVERNED_NPM_CACHE
          EOF
          npm --version
          npm config get min-release-age
          npm config get min-release-age-exclude
          npm config get before
          node ./scripts/governed-deep-review-canary.mjs materialize \
            --source-root "$GOVERNED_CI_ROOT" \
            --expected-commit "$GITHUB_SHA"

      - name: Run quality gate (ci)
        working-directory: ${{ env.GOVERNED_CI_ROOT }}
        # Package checks and release contracts run in their dedicated matrices with package deps.
        # Hermetic ontology package checks use temporary fixtures there; the real-ROCS
        # owner-workspace lane remains an explicit pre-release command outside public CI.
        run: >-
          PI_SKIP_ROCS=1
          PI_SKIP_PACKAGE_RELEASE_CONTRACTS=1
          PI_SKIP_PACKAGES=1
          PI_SKIP_HOST_COMPAT_MUTATION_TESTS=1
          npm run quality:ci
