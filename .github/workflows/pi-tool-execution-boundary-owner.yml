name: pi-tool-execution-boundary owner workstation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-tool-execution-boundary-owner
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, pi-tool-boundary-owner]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/pi-tool-execution-boundary
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: Prepare governed npm runtime policy
        shell: bash
        run: |
          set -euo pipefail
          governed_npm_version="12.0.2"
          governed_npm_prefix="${RUNNER_TEMP}/npm-prefix"
          mkdir -p "$governed_npm_prefix"
          npm install --global --prefix "$governed_npm_prefix" "npm@${governed_npm_version}" --ignore-scripts
          echo "$governed_npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install Node toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Semantic regression tests
        run: npm test

      - name: Owner-workstation preflight
        run: |
          set -euo pipefail
          mkdir -p evidence/owner-workstation
          node scripts/owner-workstation-preflight.mjs | tee evidence/owner-workstation/preflight.json

      - name: Host facts
        run: npm run bakeoff:host-facts -- --output evidence/owner-workstation/host-facts.json

      - name: Upload owner-workstation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pi-tool-execution-boundary-owner-${{ github.sha }}
          path: packages/pi-tool-execution-boundary/evidence/owner-workstation/**
          if-no-files-found: error
          retention-days: 30
