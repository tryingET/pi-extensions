name: Apply release evidence bundle

on:
  push:
    branches:
      - agent/release-sbom-attestations
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-release-evidence
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'tryingET/pi-extensions' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/release-sbom-attestations') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/release-sbom-attestations' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-sbom-attestations
          fetch-depth: 0

      - name: Apply, validate, and stage workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.github/release-evidence-bundle.part*' >/dev/null; then
            echo 'Release evidence bundle is already applied.'
            exit 0
          fi

          cat .github/release-evidence-bundle.part* | base64 --decode > "$RUNNER_TEMP/release-evidence.tgz"
          tar -xzf "$RUNNER_TEMP/release-evidence.tgz"
          python apply.py

          git diff --check
          node --check scripts/release-sbom.mjs
          node --test scripts/release-sbom.test.mjs
          node --test scripts/release-evidence-workflow.test.mjs
          node --test scripts/workflow-action-pins.test.mjs
          node --test scripts/release-components.test.mjs
          node ./scripts/release-components.mjs validate

          mkdir -p .github/release-evidence-staging
          cp .github/workflows/publish.yml .github/release-evidence-staging/publish.yml
          cp .github/workflows/release-check.yml .github/release-evidence-staging/release-check.yml
          git checkout HEAD -- \
            .github/workflows/publish.yml \
            .github/workflows/release-check.yml \
            .github/workflows/apply-release-evidence.yml
          rm -f apply.py .github/release-evidence-bundle.part*

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: stage deterministic SBOM and attestation evidence'
          git push origin HEAD:agent/release-sbom-attestations
