name: Apply idempotent npm publication

on:
  push:
    branches:
      - agent/release-recovery-integrity

permissions:
  contents: write

concurrency:
  group: apply-idempotent-npm-publication
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'tryingET/pi-extensions' && github.ref == 'refs/heads/agent/release-recovery-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-recovery-integrity
          fetch-depth: 0

      - name: Apply and validate resumable npm publication
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          publish_path = Path('.github/workflows/publish.yml')
          workflow = publish_path.read_text(encoding='utf-8')
          anchor = "      - name: Publish retained tarball to npm (OIDC + provenance)\n"
          inspect = '''      - name: Inspect immutable npm publication state
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/release-npm-state.mjs inspect \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \\
            --output-env-file "$GITHUB_ENV"

'''
          if workflow.count(anchor) != 1:
              raise SystemExit(f'expected one special publish anchor, found {workflow.count(anchor)}')
          workflow = workflow.replace(anchor, inspect + anchor, 1)

          old_special = '''      - name: Publish retained tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \\
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
'''
          new_special = '''      - name: Publish retained tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          set -euo pipefail
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \\
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          case "$RELEASE_NPM_PUBLICATION_STATE" in
            absent)
              npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
              ;;
            exact)
              echo "npm already contains the exact immutable bytes; publication is a verified no-op."
              ;;
            mismatch)
              echo "npm contains different immutable bytes; refusing to overwrite $RELEASE_PACKAGE_NAME@$RELEASE_PACKAGE_VERSION." >&2
              exit 1
              ;;
            *)
              echo "Unknown npm publication state: $RELEASE_NPM_PUBLICATION_STATE" >&2
              exit 1
              ;;
          esac
          node "$GITHUB_WORKSPACE/scripts/release-npm-state.mjs" inspect \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \\
            --require exact
'''
          if workflow.count(old_special) != 1:
              raise SystemExit(f'expected one special publish block, found {workflow.count(old_special)}')
          workflow = workflow.replace(old_special, new_special, 1)

          old_generic = '''      - name: Publish authoritative generic tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \\
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
'''
          new_generic = '''      - name: Publish authoritative generic tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          set -euo pipefail
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \\
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          case "$RELEASE_NPM_PUBLICATION_STATE" in
            absent)
              npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
              ;;
            exact)
              echo "npm already contains the exact immutable bytes; publication is a verified no-op."
              ;;
            mismatch)
              echo "npm contains different immutable bytes; refusing to overwrite $RELEASE_PACKAGE_NAME@$RELEASE_PACKAGE_VERSION." >&2
              exit 1
              ;;
            *)
              echo "Unknown npm publication state: $RELEASE_NPM_PUBLICATION_STATE" >&2
              exit 1
              ;;
          esac
          node "$GITHUB_WORKSPACE/scripts/release-npm-state.mjs" inspect \\
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \\
            --require exact
'''
          if workflow.count(old_generic) != 1:
              raise SystemExit(f'expected one generic publish block, found {workflow.count(old_generic)}')
          workflow = workflow.replace(old_generic, new_generic, 1)
          publish_path.write_text(workflow, encoding='utf-8')

          full_path = Path('scripts/ci/full.sh')
          full = full_path.read_text(encoding='utf-8')
          gate_anchor = 'node --test ./scripts/release-recovery-workflow.test.mjs\n'
          gate_addition = (
              gate_anchor
              + 'node --test ./scripts/release-npm-state.test.mjs\n'
              + 'node --test ./scripts/release-npm-workflow.test.mjs\n'
          )
          if full.count(gate_anchor) != 1:
              raise SystemExit(f'expected one root gate anchor, found {full.count(gate_anchor)}')
          full_path.write_text(full.replace(gate_anchor, gate_addition, 1), encoding='utf-8')
          PY

          git rm .github/workflows/apply-idempotent-npm-publication.yml
          git diff --check
          node --check scripts/release-npm-state.mjs
          node --test scripts/release-npm-state.test.mjs
          node --test scripts/release-npm-workflow.test.mjs
          node --test scripts/release-evidence-workflow.test.mjs
          node --test scripts/release-artifact-workflow.test.mjs
          node --test scripts/release-recovery-workflow.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: make exact npm publication resumable'
          git push origin HEAD:agent/release-recovery-integrity
