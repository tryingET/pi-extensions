name: immutable-extension-generations

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/standalone-extension-generations.mjs"
      - "scripts/standalone-extension-generations.test.mjs"
      - "scripts/verify-standalone-extension-generations.mjs"
      - "scripts/package-quality-gate.sh"
      - ".github/workflows/immutable-extension-generations.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/standalone-extension-generations.mjs"
      - "scripts/standalone-extension-generations.test.mjs"
      - "scripts/verify-standalone-extension-generations.mjs"
      - "scripts/package-quality-gate.sh"
      - ".github/workflows/immutable-extension-generations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-generations:
    name: immutable-generation-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
      - name: Install governed npm client
        run: npm install --global npm@12.0.2
      - name: Test generation ledger mechanics
        run: node --test ./scripts/standalone-extension-generations.test.mjs
      - name: Verify declared extension generations
        run: node ./scripts/verify-standalone-extension-generations.mjs
      - name: Run standalone quality gates
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r current_path _previous_path _previous_commit _migration_pr; do
            [[ -n "$current_path" ]] || continue
            package_dir="${current_path%/extensions/*}"
            if [[ ! -f "$package_dir/package.json" ]]; then
              echo "Missing owning package for $current_path" >&2
              exit 1
            fi
            echo "==> immutable generation package quality: $package_dir"
            if [[ -f "$package_dir/package-lock.json" ]]; then
              (
                cd "$package_dir"
                npm ci
              )
            fi
            ./scripts/package-quality-gate.sh ci "$package_dir"
          done < <(
            node -e '
              const fs = require("node:fs");
              const ledger = JSON.parse(fs.readFileSync("governance/standalone-extension-generations.json", "utf8"));
              for (const generation of ledger.generations) {
                console.log([generation.currentPath, generation.previousPath, generation.previousCommit, generation.migrationPr].join("\t"));
              }
            '
          )
