name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  validate-release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
      - name: Install governed npm client
        shell: bash
        run: |
          set -euo pipefail
          npm_global="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_global"
          npm install --global --prefix "$npm_global" npm@12.0.2
          echo "$npm_global/bin" >> "$GITHUB_PATH"
          "$npm_global/bin/npm" --version
      - name: Validate immutable workflow inputs
        run: node --test ./scripts/workflow-action-pins.test.mjs
      - name: Validate release component projections
        run: node ./scripts/release-components.mjs validate
      - name: Test release component resolver
        run: node --test ./scripts/release-components.test.mjs

  release-please:
    needs: validate-release-config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@cc61a07e2da466bebbc19bd7682a655e9db616a5 # reviewed v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out repository at release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - name: Verify released tag provenance
        if: ${{ steps.release.outputs.release_created == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ -n "$RELEASE_TAG" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$RELEASE_TAG")" ]]

  dispatch-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Dispatch publish workflow per released component
        uses: actions/github-script@5d0a6c5505dcf00cb12f1ed09dd261c769d8b353 # v8
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS_RELEASED_JSON: ${{ needs.release-please.outputs.paths_released }}
        with:
          script: |
            const paths = JSON.parse(process.env.PATHS_RELEASED_JSON || '[]');
            if (!Array.isArray(paths) || paths.length === 0) {
              throw new Error('Release Please reported releases_created=true without paths_released');
            }
            for (const packagePath of paths) {
              const pkg = require(`./${packagePath}/package.json`);
              const component = pkg['x-pi-template']?.releaseComponent;
              if (!component) throw new Error(`Missing release component for ${packagePath}`);
              const tag = `${component}-v${pkg.version}`;
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'publish.yml',
                ref: tag,
                inputs: { tag },
              });
            }
