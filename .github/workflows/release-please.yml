name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate release-please component metadata
        run: node ./scripts/release-components.mjs validate

      - name: Run release component tests
        run: node --test ./scripts/release-components.test.mjs

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch npm publication for created releases
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: |
          set -euo pipefail
          tags_file="$RUNNER_TEMP/release-tags.txt"
          node <<'NODE' > "$tags_file"
          const fs = require("node:fs");
          const path = require("node:path");
          const paths = JSON.parse(process.env.PATHS_RELEASED || "[]");
          const config = JSON.parse(fs.readFileSync(".release-please-config.json", "utf8"));
          for (const packagePath of paths) {
            const component = config.packages?.[packagePath]?.component;
            const manifestPath = path.join(packagePath, "package.json");
            if (typeof component !== "string" || !component || !fs.existsSync(manifestPath)) {
              throw new Error(`Cannot resolve released component at ${packagePath}`);
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (typeof manifest.version !== "string" || !manifest.version) {
              throw new Error(`Cannot resolve released version at ${packagePath}`);
            }
            process.stdout.write(`${component}-v${manifest.version}\n`);
          }
          NODE
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
          done < "$tags_file"
