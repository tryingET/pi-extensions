name: release-evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to render tapes for and attach the evidence comment to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  render-and-attach:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'release-please--branches--main') &&
       contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Evidence is about the PR head on both paths. A manual dispatch would otherwise
      # check out the dispatching branch and overwrite the PR's comment with its tapes.
      # Same-repo only, as on the pull_request path: the render step holds a user token.
      - name: Resolve PR head commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_HEAD_SHA" ]; then
            # pull_request: this job's check is attached to the event's head; the job
            # condition already requires a same-repo head.
            echo "sha=${EVENT_HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r sha cross < <(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid,isCrossRepository --jq '"\(.headRefOid) \(.isCrossRepository)"')
          if [ "$cross" != "false" ]; then
            echo "::error::PR ${PR_NUMBER} comes from another repository; release evidence renders same-repo PRs only."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: Install ttyd 1.7.7 and vhs v0.11.0
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ttyd" "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64"
          sudo install -m 0755 "$RUNNER_TEMP/ttyd" /usr/local/bin/ttyd
          curl -fsSL -o "$RUNNER_TEMP/vhs.deb" "https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo dpkg -i "$RUNNER_TEMP/vhs.deb"
          ttyd --version
          vhs --version

      - name: Ensure gh supports --attach (>= 2.99.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(gh --version | sed -n 's/^gh version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          if [ -n "$v" ] && [ "$(printf '%s\n' 2.99.0 "$v" | sort -V | head -1)" = "2.99.0" ]; then
            echo "runner gh $v supports --attach"
            exit 0
          fi
          echo "runner gh ${v:-unknown} too old for --attach; installing latest gh"
          tag="$(gh api repos/cli/cli/releases/latest --jq .tag_name)"
          ver="${tag#v}"
          curl -fsSL -o "$RUNNER_TEMP/gh.tgz" "https://github.com/cli/cli/releases/download/${tag}/gh_${ver}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/gh_${ver}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Require user-token secret for attachment upload
        env:
          EVIDENCE_GH_TOKEN: ${{ secrets.EVIDENCE_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EVIDENCE_GH_TOKEN:-}" ]; then
            echo "::error::repo secret EVIDENCE_GH_TOKEN is not set."
            echo "gh --attach uploads to uploads.github.com/user-attachments (user-scoped assets):"
            echo "the Actions GITHUB_TOKEN is an installation token with no user identity and is"
            echo "rejected with 'unsupported authentication type'."
            echo "Fix: mint a FINE-GRAINED PAT scoped to this repository only, with pull requests:"
            echo "read+write (do NOT use a classic repo-scope PAT — its blast radius is all your"
            echo "repos) and add it as repo secret EVIDENCE_GH_TOKEN, then re-run this workflow."
            exit 1
          fi
          echo "EVIDENCE_GH_TOKEN present"

      - name: Render tapes and attach evidence comment
        env:
          GH_TOKEN: ${{ secrets.EVIDENCE_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: node ./scripts/release-evidence.mjs --pr "$PR_NUMBER" --edit-last

      # The release-PR evidence gate. It runs after production in this job, so it cannot
      # race the renderer, and it accepts only a comment naming this exact head commit,
      # so an evidence comment left over from an earlier PR head never passes.
      - name: Verify evidence comment for this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          head="$(git rev-parse --short HEAD)"
          comments="$RUNNER_TEMP/evidence-comments.json"
          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" > "$comments"
          for_head=$(jq -s --arg head "(${head})\`" \
            '[.[][].body | select(contains("<!-- release-evidence -->") and contains($head))]' "$comments")
          if [ "$(jq 'length' <<<"$for_head")" -eq 0 ]; then
            echo "::error::PR ${PR_NUMBER} has no release-evidence comment naming head ${head}. The render step above did not publish evidence for this commit; fix it and re-run this job (tapes/CONVENTIONS.md)."
            exit 1
          fi
          if [ "$(jq '[.[] | select(contains("user-attachments"))] | length' <<<"$for_head")" -eq 0 ]; then
            echo "::error::The release-evidence comment for head ${head} carries no uploaded attachments; re-run this job."
            exit 1
          fi
          echo "release-evidence comment with attachments present for head ${head} on PR ${PR_NUMBER}"
