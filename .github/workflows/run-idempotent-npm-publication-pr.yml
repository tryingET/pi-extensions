name: Run idempotent npm publication applicator

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-idempotent-npm-publication-pr
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'tryingET/pi-extensions' &&
      github.head_ref == 'agent/release-recovery-integrity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-recovery-integrity
          fetch-depth: 0

      - name: Transform semantic publish steps and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          publish_path = Path('.github/workflows/publish.yml')
          workflow = publish_path.read_text(encoding='utf-8')

          def block(lines):
              return '\n'.join(lines) + '\n'

          def replace_step(text, name, replacement):
              marker = f'      - name: {name}\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'workflow step not found: {name}')
              candidates = [
                  position
                  for position in (
                      text.find('\n      - name:', start + len(marker)),
                      text.find('\n\n  ', start + len(marker)),
                  )
                  if position >= 0
              ]
              if not candidates:
                  raise SystemExit(f'workflow step boundary not found: {name}')
              end = min(candidates)
              return text[:start] + replacement + text[end + 1:]

          inspect_name = 'Inspect immutable npm publication state'
          special_name = 'Publish retained tarball to npm (OIDC + provenance)'
          generic_name = 'Publish authoritative generic tarball to npm (OIDC + provenance)'
          special_marker = f'      - name: {special_name}\n'
          if f'      - name: {inspect_name}\n' not in workflow:
              inspect = block([
                  f'      - name: {inspect_name}',
                  '        shell: bash',
                  '        run: |',
                  '          set -euo pipefail',
                  '          node ./scripts/release-npm-state.mjs inspect \\',
                  '            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \\',
                  '            --output-env-file "$GITHUB_ENV"',
                  '',
              ])
              if workflow.count(special_marker) != 1:
                  raise SystemExit('special publish anchor is not unique')
              workflow = workflow.replace(special_marker, inspect + special_marker, 1)

          def publish_step(name, condition):
              return block([
                  f'      - name: {name}',
                  f'        if: {condition}',
                  '        working-directory: $' + '{{ env.RELEASE_PACKAGE_PATH }}',
                  '        env:',
                  '          NPM_CONFIG_BIN_LINKS: "false"',
                  '        run: |',
                  '          set -euo pipefail',
                  '          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status',
                  '          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \\',
                  '            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"',
                  '          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \\',
                  '            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"',
                  '          case "$RELEASE_NPM_PUBLICATION_STATE" in',
                  '            absent)',
                  '              npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"',
                  '              ;;',
                  '            exact)',
                  '              echo "npm already contains the exact immutable bytes; publication is a verified no-op."',
                  '              ;;',
                  '            mismatch)',
                  '              echo "npm contains different immutable bytes; refusing to overwrite $RELEASE_PACKAGE_NAME@$RELEASE_PACKAGE_VERSION." >&2',
                  '              exit 1',
                  '              ;;',
                  '            *)',
                  '              echo "Unknown npm publication state: $RELEASE_NPM_PUBLICATION_STATE" >&2',
                  '              exit 1',
                  '              ;;',
                  '          esac',
                  '          node "$GITHUB_WORKSPACE/scripts/release-npm-state.mjs" inspect \\',
                  '            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \\',
                  '            --require exact',
                  '',
              ])

          workflow = replace_step(
              workflow,
              special_name,
              publish_step(
                  special_name,
                  "env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'",
              ),
          )
          workflow = replace_step(
              workflow,
              generic_name,
              publish_step(
                  generic_name,
                  "env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'",
              ),
          )
          publish_path.write_text(workflow, encoding='utf-8')

          full_path = Path('scripts/ci/full.sh')
          full = full_path.read_text(encoding='utf-8')
          anchor = 'node --test ./scripts/release-recovery-workflow.test.mjs\n'
          additions = (
              anchor
              + 'node --test ./scripts/release-npm-state.test.mjs\n'
              + 'node --test ./scripts/release-npm-workflow.test.mjs\n'
          )
          if 'release-npm-state.test.mjs' not in full:
              if full.count(anchor) != 1:
                  raise SystemExit('root quality gate anchor is not unique')
              full = full.replace(anchor, additions, 1)
              full_path.write_text(full, encoding='utf-8')
          PY

          git rm \
            .github/workflows/apply-idempotent-npm-publication.yml \
            .github/workflows/run-idempotent-npm-publication-pr.yml
          git diff --check
          node --check scripts/release-npm-state.mjs
          node --test scripts/release-npm-state.test.mjs
          node --test scripts/release-npm-workflow.test.mjs
          node --test scripts/release-evidence-workflow.test.mjs
          node --test scripts/release-artifact-workflow.test.mjs
          node --test scripts/release-recovery-workflow.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: make exact npm publication resumable'
          git push origin HEAD:agent/release-recovery-integrity
