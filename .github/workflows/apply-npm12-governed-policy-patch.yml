name: Apply npm 12 governed-policy repair

on:
  push:
    branches:
      - agent/npm12-governed-policy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npm12-governed-policy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact one-shot patch
        run: node scripts/apply-npm12-governed-policy-patch.mjs
      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): prove npm 12 release-age policy directly"
          git push origin HEAD:agent/npm12-governed-policy
