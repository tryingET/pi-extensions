name: Apply release recovery bundle

on:
  push:
    branches:
      - agent/release-recovery-integrity
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-release-recovery
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'tryingET/pi-extensions' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/release-recovery-integrity') ||
       (github.event_name == 'pull_request' &&
        github.head_ref == 'agent/release-recovery-integrity' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/release-recovery-integrity
          fetch-depth: 0

      - name: Apply, validate, and stage workflow activation
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.github/recovery-bundle.part*' >/dev/null; then
            echo 'Release recovery bundle is already applied.'
            exit 0
          fi

          cat .github/recovery-bundle.part* | base64 --decode > "$RUNNER_TEMP/recovery-bundle.tgz"
          tar -xzf "$RUNNER_TEMP/recovery-bundle.tgz"
          python apply.py

          git diff --check
          node --check scripts/release-evidence-archive.mjs
          node --check scripts/release-state.mjs
          node --test scripts/release-evidence-archive.test.mjs
          node --test scripts/release-state.test.mjs
          node --test scripts/release-recovery-workflow.test.mjs
          node --test scripts/workflow-action-pins.test.mjs
          node --test scripts/release-components.test.mjs
          node ./scripts/release-components.mjs validate

          mkdir -p .github/recovery-staging
          cp .github/workflows/publish.yml .github/recovery-staging/publish.yml
          git checkout HEAD -- .github/workflows/publish.yml
          rm -f apply.py
          rm -rf payload
          rm -f .github/recovery-bundle.part*

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: stage durable evidence recovery controls'
          git push origin HEAD:agent/release-recovery-integrity
