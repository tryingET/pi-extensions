name: node-next

# Advisory lane: every package's tests on the lock's next Node line (`nextNodeVersion` in
# policy/ci-toolchain-lock.json), so moving the pin is proven before it happens. The job never
# fails the run; the pinned lanes in ci and release-check remain the only merge and release gates.
# One job with every package installed, because package tests first verify their local
# `file:` sibling links, exactly as the pre-push gate runs them.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      PI_GATE_NODE_LANE: next
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.9.0"
          package-manager-cache: false

      - name: Prepare managed scratch and npm
        run: |
          lane_tmp="$RUNNER_TEMP/node-next"
          mkdir -p "$lane_tmp" "$RUNNER_TEMP/npm-global"
          echo "TMPDIR=$lane_tmp" >> "$GITHUB_ENV"
          npm install --global --prefix "$RUNNER_TEMP/npm-global" npm@12.0.2
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-global/bin/npm" --version

      - name: Admit the next Node lane
        run: node ./scripts/check-gate-toolchain.mjs

      - name: Install Dolt for vault tests
        run: |
          dolt_version="2.3.1"
          dolt_commit="b15770fe588268027d799c11356af0ce24ba882a"
          dolt_template_blob="b212efe0dcb5b8ac05ceeefad17a65f19a5f502b"
          template="$RUNNER_TEMP/install-dolt.template.sh"
          expected="$RUNNER_TEMP/install-dolt.expected.sh"
          installer="$RUNNER_TEMP/install-dolt.sh"
          curl -fsSL "https://raw.githubusercontent.com/dolthub/dolt/$dolt_commit/go/utils/publishrelease/install.sh" -o "$template"
          test "$(git hash-object "$template")" = "$dolt_template_blob"
          sed "s/__DOLT_VERSION__/$dolt_version/g" "$template" > "$expected"
          curl -fsSL "https://github.com/dolthub/dolt/releases/download/v$dolt_version/install.sh" -o "$installer"
          cmp "$expected" "$installer"
          sudo bash "$installer"
          dolt version | grep -F "$dolt_version"
          dolt config --global --set user.name "github-actions[bot]"
          dolt config --global --set user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install every package
        shell: bash
        run: |
          set -euo pipefail
          for lock in packages/*/package-lock.json packages/pi-interaction/*/package-lock.json; do
            [[ -f "$lock" ]] || continue
            echo "::group::npm ci $(dirname "$lock")"
            npm ci --prefix "$(dirname "$lock")" --no-audit --no-fund
            echo "::endgroup::"
          done

      - name: Build gate-required outputs
        run: |
          npm --prefix packages/pi-autonomous-session-control run build:runtime
          npm --prefix packages/pi-society-orchestrator run task-session:build
          npm --prefix packages/pi-little-helpers run task-session:build
          npm --prefix packages/pi-telemetry run build:review-runtime

      - name: Run every package's tests
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          {
            echo "### Package tests on Node $(node --version)"
            echo
            echo "| package | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in packages/*/; do
            [[ -f "$dir/package.json" ]] || continue
            name="$(basename "$dir")"
            echo "::group::$name"
            if ./scripts/ci/packages.sh test --package "$dir"; then
              echo "| $name | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | **fail** |" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::Node $(node --version) failures: ${failed[*]}"
            exit 1
          fi
