name: Repair release artifact parser

on:
  push:
    branches:
      - agent/exact-release-artifact

permissions:
  contents: write

concurrency:
  group: repair-release-artifact-parser
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'tryingET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/exact-release-artifact
          fetch-depth: 0

      - name: Replace parser and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("scripts/release-artifact.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''function parsePackJson(text) {
            const first = text.indexOf("[");
            const last = text.lastIndexOf("]");
            if (first < 0 || last < first) fail("npm pack did not emit a JSON array");
            const parsed = JSON.parse(text.slice(first, last + 1));
            if (!Array.isArray(parsed) || parsed.length !== 1 || !parsed[0]) {
              fail("npm pack must produce exactly one artifact");
            }
            return parsed[0];
          }
          '''
          new = '''function matchingArrayEnd(text, start) {
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let index = start; index < text.length; index += 1) {
              const char = text[index];
              if (inString) {
                if (escaped) {
                  escaped = false;
                } else if (char === "\\\\") {
                  escaped = true;
                } else if (char === '\"') {
                  inString = false;
                }
                continue;
              }
              if (char === '\"') {
                inString = true;
              } else if (char === "[") {
                depth += 1;
              } else if (char === "]") {
                depth -= 1;
                if (depth === 0) return index;
                if (depth < 0) return -1;
              }
            }
            return -1;
          }

          function parsePackJson(text) {
            const valid = [];
            for (let start = 0; start < text.length; start += 1) {
              if (text[start] !== "[") continue;
              const end = matchingArrayEnd(text, start);
              if (end < 0) continue;
              try {
                const parsed = JSON.parse(text.slice(start, end + 1));
                if (
                  Array.isArray(parsed) &&
                  parsed.length === 1 &&
                  parsed[0] &&
                  typeof parsed[0] === "object" &&
                  typeof parsed[0].filename === "string"
                ) {
                  valid.push(parsed[0]);
                }
              } catch {
                // Lifecycle output may contain bracketed non-JSON text. Keep scanning.
              }
            }
            if (valid.length === 0) fail("npm pack did not emit one valid artifact JSON array");
            return valid.at(-1);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected parsePackJson implementation was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git rm .github/workflows/repair-release-artifact-parser.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/release-artifact.mjs
          git commit -m "fix(release): parse npm pack JSON amid lifecycle output"
          git push origin HEAD:agent/exact-release-artifact
