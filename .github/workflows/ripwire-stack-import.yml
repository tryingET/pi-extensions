name: Import ripwire stack increment
on:
  push:
    branches: [work/context-packer-ripwire-bootstrap]
    paths: ['.ripwire-stack/inbox/*.json', '.github/workflows/ripwire-stack-import.yml']
permissions:
  contents: write
concurrency:
  group: ripwire-stack-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and import restricted stack refs
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile, zlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def decode_chunks(data):
              # Repair at most one transcription edit per bounded block. The final
              # SHA-256 and Git object identities remain mandatory; CRC is not trust.
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              size, length = 256, data['base64Length']
              assert 0 < length < 1000000
              assert len(data['chunks']) == (length+size-1)//size
              result = []
              repaired = []
              for index, line in enumerate(data['chunks']):
                  crc, text = line[:8], line[9:]
                  assert line[8] == ':' and re.fullmatch('[0-9a-f]{8}',crc)
                  want = min(size, length-index*size)
                  check = lambda value: f'{zlib.crc32(value.encode()):08x}' == crc
                  if len(text) == want and check(text):
                      result.append(text); continue
                  candidates = set()
                  def consider(value):
                      if check(value): candidates.add(value)
                  if len(text) == want:
                      for pos in range(want):
                          for char in alphabet:
                              consider(text[:pos]+char+text[pos+1:])
                      for pos in range(want-1):
                          consider(text[:pos]+text[pos+1]+text[pos]+text[pos+2:])
                  elif len(text) == want-1:
                      for pos in range(want):
                          for char in alphabet:
                              consider(text[:pos]+char+text[pos:])
                  elif len(text) == want+1:
                      for pos in range(want+1): consider(text[:pos]+text[pos+1:])
                  assert len(candidates) == 1, f'Unrecoverable chunk {index}'
                  result.append(candidates.pop()); repaired.append(index)
              print('Corrected transport blocks:',repaired)
              return ''.join(result)
          changed = git('diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']).splitlines()
          receipts = []
          for name in changed:
              if not re.fullmatch(r'\.ripwire-stack/inbox/[0-9]{2}-[a-z0-9-]+\.json', name): continue
              p = pathlib.Path(name)
              assert p.stat().st_size < 1000000
              data = json.loads(p.read_text())
              if 'source' in data:
                  assert re.fullmatch(r'[0-9]{2}-[a-z0-9-]+\.json', data['source'])
                  original = json.loads((p.parent/data['source']).read_text())
                  if 'chunks' in original:
                      original['bundle'] = ''.join(line[9:] for line in original.pop('chunks'))
                  for before, after in data['corrections']:
                      assert original['bundle'].count(before) == 1
                      original['bundle'] = original['bundle'].replace(before, after)
                  data = original
              branch, parent, head = data['branch'], data['parent'], data['head']
              assert re.fullmatch(r'stack/ripwire/0[2-9]-[a-z0-9-]+', branch)
              assert re.fullmatch(r'[0-9a-f]{40}', parent) and re.fullmatch(r'[0-9a-f]{40}', head)
              encoded = decode_chunks(data) if 'chunks' in data else data['bundle']
              blob = base64.b64decode(encoded, validate=True)
              assert hashlib.sha256(blob).hexdigest() == data['sha256'], 'Transfer digest mismatch'
              git('fetch', 'origin', parent)
              with tempfile.TemporaryDirectory() as temp:
                  archive = pathlib.Path(temp)/'change.bundle'
                  archive.write_bytes(blob)
                  git('bundle','verify',str(archive))
                  refs = git('bundle','list-heads',str(archive)).splitlines()
                  assert refs == [head+' refs/heads/'+branch], refs
                  git('fetch',str(archive),'refs/heads/'+branch)
                  assert git('rev-parse',head+'^') == parent
                  paths = git('diff','--name-only',parent,head).splitlines()
                  assert paths and all(x.startswith('packages/pi-context-packer/') or x == 'policy/file-budget-exceptions.json' for x in paths)
                  current = git('ls-remote','--heads','origin','refs/heads/'+branch)
                  if current: assert current.split()[0] == head, 'Ref exists at another candidate; refusing overwrite'
                  else: git('push','origin',head+':refs/heads/'+branch)
                  receipts.append({'branch':branch,'head':head,'parent':parent,'tree':git('rev-parse',head+'^{tree}'),'imported':True})
          pathlib.Path(os.environ['RUNNER_TEMP'],'import-receipt.json').write_text(json.dumps(receipts,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripwire-import-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/import-receipt.json
            .ripwire-stack/inbox/*.json
          retention-days: 14
