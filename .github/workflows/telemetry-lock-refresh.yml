name: Temporary telemetry lock refresh

on:
  push:
    branches: [agent/telemetry-typecheck]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telemetry-typecheck
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Refresh package lock only
        working-directory: packages/pi-telemetry
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/pi-telemetry/package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/pi-telemetry/package-lock.json
          git commit -m 'Refresh pi-telemetry lockfile for type checking'
          git push origin HEAD:agent/telemetry-typecheck
