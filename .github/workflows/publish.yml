name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Component release tag (for example pi-interaction-kit-v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm
    steps:
      - name: Verify workflow ref is the immutable release tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG_INPUT" ]]; then
            echo "Publish must execute from refs/tags/$RELEASE_TAG_INPUT, got $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
      - name: Install governed npm client
        shell: bash
        run: |
          set -euo pipefail
          npm_global="$RUNNER_TEMP/npm-global"
          mkdir -p "$npm_global"
          npm install --global --prefix "$npm_global" npm@12.0.2
          echo "$npm_global/bin" >> "$GITHUB_PATH"
          "$npm_global/bin/npm" --version
      - name: Verify tag provenance and resolve release component
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG_INPUT" ]]
          git fetch origin main --tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$RELEASE_TAG_INPUT")" ]]
          git merge-base --is-ancestor HEAD origin/main
          node ./scripts/release-components.mjs validate
          node ./scripts/release-components.mjs resolve-tag "$RELEASE_TAG_INPUT" --env >> "$GITHUB_ENV"
      - name: Verify package metadata matches tag
        shell: bash
        run: |
          set -euo pipefail
          [[ -d "$RELEASE_PACKAGE_PATH" ]]
          package_version="$(node -p "require('./$RELEASE_PACKAGE_PATH/package.json').version")"
          package_name="$(node -p "require('./$RELEASE_PACKAGE_PATH/package.json').name")"
          [[ "$package_version" == "$RELEASE_TAG_VERSION" ]]
          [[ "$RELEASE_PACKAGE_VERSION" == "$RELEASE_TAG_VERSION" ]]
          [[ "$package_name" == "$RELEASE_PACKAGE_NAME" ]]
          if npm view "$RELEASE_PACKAGE_NAME@$RELEASE_TAG_VERSION" version >/dev/null 2>&1; then
            echo "$RELEASE_PACKAGE_NAME@$RELEASE_TAG_VERSION is already published; refusing to overwrite immutable npm version." >&2
            exit 1
          fi
      - name: Install package and local file-dependency trees
        shell: bash
        env:
          RELEASE_PACKAGE_PATH_ENV: ${{ env.RELEASE_PACKAGE_PATH }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const root = path.resolve(process.cwd(), process.env.RELEASE_PACKAGE_PATH_ENV);
          const seen = new Set();

          function installPackage(dir) {
            const real = fs.realpathSync(dir);
            if (seen.has(real)) return;
            seen.add(real);

            const manifestPath = path.join(real, 'package.json');
            if (!fs.existsSync(manifestPath)) return;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const deps = {
              ...(manifest.dependencies || {}),
              ...(manifest.devDependencies || {}),
              ...(manifest.optionalDependencies || {}),
            };

            for (const spec of Object.values(deps)) {
              if (typeof spec !== 'string' || !spec.startsWith('file:')) continue;
              const depDir = path.resolve(real, spec.slice('file:'.length));
              if (!depDir.startsWith(path.resolve(root, '..'))) continue;
              installPackage(depDir);
            }

            const lockPath = path.join(real, 'package-lock.json');
            if (fs.existsSync(lockPath)) {
              try {
                execFileSync('npm', ['ci'], { cwd: real, stdio: 'inherit' });
              } catch (error) {
                console.warn(`npm ci failed for ${real}; refreshing lockfile metadata before retry.`);
                execFileSync(
                  'npm',
                  ['install', '--package-lock-only', '--ignore-scripts'],
                  { cwd: real, stdio: 'inherit' },
                );
                execFileSync('npm', ['ci'], { cwd: real, stdio: 'inherit' });
              }
            } else {
              execFileSync(
                'npm',
                ['install', '--package-lock-only', '--ignore-scripts'],
                { cwd: real, stdio: 'inherit' },
              );
              execFileSync('npm', ['ci'], { cwd: real, stdio: 'inherit' });
            }
          }

          installPackage(root);
          NODE
      - name: Install Dolt
        shell: bash
        run: |
          set -euo pipefail
          dolt_version="2.3.1"
          dolt_commit="b15770fe588268027d799c11356af0ce24ba882a"
          dolt_template_blob="b212efe0dcb5b8ac05ceeefad17a65f19a5f502b"
          template="$RUNNER_TEMP/install-dolt.template.sh"
          expected="$RUNNER_TEMP/install-dolt.expected.sh"
          installer="$RUNNER_TEMP/install-dolt.sh"
          curl -fsSL "https://raw.githubusercontent.com/dolthub/dolt/$dolt_commit/go/utils/publishrelease/install.sh" -o "$template"
          test "$(git hash-object "$template")" = "$dolt_template_blob"
          sed "s/__DOLT_VERSION__/$dolt_version/g" "$template" > "$expected"
          curl -fsSL "https://github.com/dolthub/dolt/releases/download/v$dolt_version/install.sh" -o "$installer"
          cmp "$expected" "$installer"
          sudo bash "$installer"
          dolt version | grep -F "$dolt_version"
      - name: Run package quality gate
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        run: npm run check
      - name: Build retained release tarball for pi-snapshot-edit
        if: ${{ env.RELEASE_COMPONENT == 'pi-snapshot-edit' }}
        id: snapshot_edit_tarball
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          printf 'path=%s\n' "$PWD/$tarball" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
      - name: Build retained release tarball for pi-modes
        if: ${{ env.RELEASE_COMPONENT == 'pi-modes' }}
        id: pi_modes_tarball
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          printf 'path=%s\n' "$PWD/$tarball" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
      - name: Run generic release check
        if: ${{ env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        run: npm run release:check:quick
      - name: Run pi-snapshot-edit release checks against retained tarball
        if: ${{ env.RELEASE_COMPONENT == 'pi-snapshot-edit' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          RELEASE_TARBALL: ${{ steps.snapshot_edit_tarball.outputs.path }}
        run: |
          PI_SMOKE_TARBALL="$RELEASE_TARBALL" npm run release:check:quick
          npm run test:install
      - name: Run pi-modes release checks against retained tarball
        if: ${{ env.RELEASE_COMPONENT == 'pi-modes' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          RELEASE_TARBALL: ${{ steps.pi_modes_tarball.outputs.path }}
        run: PI_SMOKE_TARBALL="$RELEASE_TARBALL" npm run release:check:quick
      - name: Verify retained pi-snapshot-edit tarball metadata
        if: ${{ env.RELEASE_COMPONENT == 'pi-snapshot-edit' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          RELEASE_TARBALL: ${{ steps.snapshot_edit_tarball.outputs.path }}
        run: |
          tarball_name=$(basename "$RELEASE_TARBALL")
          test -f "$RELEASE_TARBALL"
          test -s "$RELEASE_TARBALL"
          tarball_sha256=$(sha256sum "$RELEASE_TARBALL" | awk '{print $1}')
          test -n "$tarball_sha256"
          printf 'RELEASE_TARBALL_PATH=%s\n' "$RELEASE_TARBALL" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_NAME=%s\n' "$tarball_name" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_SHA256=%s\n' "$tarball_sha256" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_SHA256  %s\n' "$tarball_name" > "$RELEASE_TARBALL.sha256"
      - name: Verify retained pi-modes tarball metadata
        if: ${{ env.RELEASE_COMPONENT == 'pi-modes' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          RELEASE_TARBALL: ${{ steps.pi_modes_tarball.outputs.path }}
        run: |
          tarball_name=$(basename "$RELEASE_TARBALL")
          test -f "$RELEASE_TARBALL"
          test -s "$RELEASE_TARBALL"
          tarball_sha256=$(sha256sum "$RELEASE_TARBALL" | awk '{print $1}')
          test -n "$tarball_sha256"
          printf 'RELEASE_TARBALL_PATH=%s\n' "$RELEASE_TARBALL" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_NAME=%s\n' "$tarball_name" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_SHA256=%s\n' "$tarball_sha256" >> "$GITHUB_ENV"
          printf 'RELEASE_TARBALL_SHA256  %s\n' "$tarball_name" > "$RELEASE_TARBALL.sha256"
      - name: Publish package from governed npm tarball
        if: ${{ env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
      - name: Publish package
        if: ${{ env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes' }}
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
      - name: Upload governed npm tarball evidence
        if: ${{ env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-tarball-${{ env.RELEASE_COMPONENT }}-${{ env.RELEASE_TAG_VERSION }}
          path: |
            ${{ env.RELEASE_TARBALL_PATH }}
            ${{ env.RELEASE_TARBALL_PATH }}.sha256
          if-no-files-found: error
          retention-days: 30
