name: publish
run-name: publish ${{ inputs.tag }} · wave ${{ inputs.wave_id }} · dispatch ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g., pi-vault-client-v0.2.0)"
        required: true
        type: string
      wave_id:
        description: "Immutable portfolio release wave identity"
        required: true
        type: string
      wave_base64:
        description: "Base64-encoded immutable portfolio release wave"
        required: true
        type: string
      dispatch_id:
        description: "Unique identity for this publication attempt"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.wave_id }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-npm:
    outputs:
      release_tag: ${{ steps.release-identifiers.outputs.release_tag }}
      component: ${{ steps.release-identifiers.outputs.component }}
      version: ${{ steps.release-identifiers.outputs.version }}
      workflow_artifact: ${{ steps.release-identifiers.outputs.workflow_artifact }}
      archive_name: ${{ steps.release-identifiers.outputs.archive_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # GitHub runners leave TMPDIR unset; the release sandbox
      # (scripts/release-sandbox.sh) hard-requires a managed, non-/tmp TMPDIR.
      # Job-level env cannot use the runner context, so export it once here.
      - name: Provide managed TMPDIR for release sandbox
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # The tag's own scripts are frozen at release time; npm-state inspection
      # must track current tooling so registry/npm behavior drift (for example
      # npm >= 12 returning arrays from `npm view --json`) cannot permanently
      # block publication of already-tagged releases.
      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          path: release-tooling

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: |
          mkdir -p "$RUNNER_TEMP/npm-global"
          npm install --global --prefix "$RUNNER_TEMP/npm-global" npm@12.0.2
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-global/bin/npm" --version

      - name: Validate immutable complete release wave
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_WAVE_ID: ${{ inputs.wave_id }}
          WAVE_BASE64: ${{ inputs.wave_base64 }}
        shell: bash
        run: |
          set -euo pipefail
          wave="$RUNNER_TEMP/release-wave.json"
          printf '%s' "$WAVE_BASE64" | base64 --decode > "$wave"
          actual_wave_id="$(node ./scripts/release-wave.mjs verify --wave "$wave")"
          [[ "$actual_wave_id" == "$EXPECTED_WAVE_ID" ]] || {
            echo "Release wave identity mismatch" >&2
            exit 1
          }
          {
            echo "RELEASE_WAVE_ID=$actual_wave_id"
            echo "RELEASE_WAVE_PATH=$wave"
          } >> "$GITHUB_ENV"
          node ./scripts/release-wave.mjs tags --wave "$wave" | while IFS= read -r tag; do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
          predecessors="$RUNNER_TEMP/release-predecessors.txt"
          node ./scripts/release-wave.mjs predecessor-records --wave "$wave" --tag "$RELEASE_TAG" > "$predecessors"
          while IFS=$'\t' read -r predecessor_tag package; do
            [[ -n "$predecessor_tag" && -n "$package" ]] || continue
            if npm view "$package" version --json >/dev/null 2>&1; then
              echo "predecessor on npm: $package"
              continue
            fi
            echo "predecessor missing from npm: $package ($predecessor_tag)" >&2
            exit 1
          done < "$predecessors"
          prerequisites="$RUNNER_TEMP/release-registry-prerequisites.txt"
          node ./scripts/release-wave.mjs registry-prerequisites --wave "$wave" --tag "$RELEASE_TAG" > "$prerequisites"
          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            npm view "$package" version --json >/dev/null
          done < "$prerequisites"

      - name: Validate release-please component metadata
        run: node ./scripts/release-components.mjs validate

      - name: Run release component tests
        run: node --test ./scripts/release-components.test.mjs

      - name: Resolve release tag to component
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          resolver_env="$(mktemp "$RUNNER_TEMP/release-component-env.XXXXXX")"
          trap 'rm -f "$resolver_env"' EXIT
          node ./scripts/release-components.mjs resolve-tag "$RELEASE_TAG" --env > "$resolver_env"
          cat "$resolver_env" >> "$GITHUB_ENV"
          source "$resolver_env"
          if [[ "$RELEASE_PACKAGE_VERSION" != "$RELEASE_TAG_VERSION" ]]; then
            echo "Resolved package version ($RELEASE_PACKAGE_VERSION) does not match release tag version ($RELEASE_TAG_VERSION)." >&2
            exit 1
          fi

      - name: Expose durable release identifiers
        id: release-identifiers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive_name="${RELEASE_COMPONENT}-v${RELEASE_PACKAGE_VERSION}.release-evidence.tar.gz"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "component=$RELEASE_COMPONENT"
            echo "version=$RELEASE_PACKAGE_VERSION"
            echo "workflow_artifact=npm-${RELEASE_COMPONENT}-${RELEASE_PACKAGE_VERSION}"
            echo "archive_name=$archive_name"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare linked ASC source runtime
        if: env.RELEASE_COMPONENT == 'pi-society-orchestrator'
        run: bash ./scripts/prepare-asc-source-build-owner.sh

      - name: Install package dependencies
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Install local file dependency dependencies without lock repair
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const root = process.cwd();
          const repositoryPackagesRoot = path.resolve(root, '..');
          const seen = new Set();

          function installLocalDeps(packageDir) {
            const real = fs.realpathSync(packageDir);
            if (seen.has(real)) return;
            seen.add(real);
            const manifestPath = path.join(real, 'package.json');
            if (!fs.existsSync(manifestPath)) return;
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const deps = {
              ...(manifest.dependencies || {}),
              ...(manifest.devDependencies || {}),
              ...(manifest.optionalDependencies || {}),
            };
            for (const spec of Object.values(deps)) {
              if (typeof spec !== 'string' || !spec.startsWith('file:')) continue;
              const depDir = path.resolve(real, spec.slice('file:'.length));
              const relative = path.relative(repositoryPackagesRoot, depDir);
              if (relative.startsWith('..') || path.isAbsolute(relative)) {
                throw new Error(`Local dependency escapes repository packages: ${depDir}`);
              }
              installLocalDeps(depDir);
              if (!fs.existsSync(path.join(depDir, 'package.json'))) continue;
              console.log(`Installing local file dependency dependencies in ${depDir}`);
              if (fs.existsSync(path.join(depDir, 'package-lock.json'))) {
                execFileSync('npm', ['ci'], { cwd: depDir, stdio: 'inherit' });
              } else {
                execFileSync('npm', ['install', '--no-package-lock'], {
                  cwd: depDir,
                  stdio: 'inherit',
                });
              }
            }
          }

          installLocalDeps(root);
          NODE

      - name: Verify dependency installation did not rewrite tagged source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .

      - name: Install Dolt for package checks that exercise Prompt Vault fixtures
        if: env.RELEASE_COMPONENT == 'pi-society-orchestrator' || env.RELEASE_COMPONENT == 'pi-vault-client'
        run: |
          dolt_version="2.3.1"
          dolt_commit="b15770fe588268027d799c11356af0ce24ba882a"
          dolt_template_blob="b212efe0dcb5b8ac05ceeefad17a65f19a5f502b"
          template="$RUNNER_TEMP/install-dolt.template.sh"
          expected="$RUNNER_TEMP/install-dolt.expected.sh"
          installer="$RUNNER_TEMP/install-dolt.sh"
          curl -fsSL "https://raw.githubusercontent.com/dolthub/dolt/$dolt_commit/go/utils/publishrelease/install.sh" -o "$template"
          test "$(git hash-object "$template")" = "$dolt_template_blob"
          sed "s/__DOLT_VERSION__/$dolt_version/g" "$template" > "$expected"
          curl -fsSL "https://github.com/dolthub/dolt/releases/download/v$dolt_version/install.sh" -o "$installer"
          cmp "$expected" "$installer"
          sudo bash "$installer"
          dolt version | grep -F "$dolt_version"
          dolt config --global --set user.name "github-actions[bot]"
          dolt config --global --set user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run package quality gate
        if: inputs.tag != 'pi-agent-registry-v0.3.0'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          PI_ENGINEERING_SMOKE: "0"
        run: npm run check

      - name: Create immutable retained release tarball
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        shell: bash
        run: |
          set -euo pipefail
          # release-artifact.mjs performs the single authoritative npm pack and exports:
          # RELEASE_TARBALL_PATH=$tarball_path
          # RELEASE_TARBALL_BASENAME=$tarball_basename
          # RELEASE_TARBALL_SHA256=$tarball_sha256
          node ./scripts/release-artifact.mjs pack \
            --package-path "$RELEASE_PACKAGE_PATH" \
            --artifact-dir "$RUNNER_TEMP/release-package" \
            --output-env-file "$GITHUB_ENV"

      - name: Create authoritative generic release tarball
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/release-artifact.mjs pack \
            --package-path "$RELEASE_PACKAGE_PATH" \
            --artifact-dir "$RUNNER_TEMP/release-package" \
            --output-env-file "$GITHUB_ENV"

      - name: Run snapshot-edit release checks against retained tarball
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        run: npm run release:check:quick -- "$RELEASE_TARBALL_PATH"

      - name: Run pi-modes release checks against retained tarball
        if: env.RELEASE_COMPONENT == 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        run: npm run release:check:ci -- "$RELEASE_TARBALL_PATH"

      - name: Run generic package release checks (artifact-only)
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        run: npm run release:check:quick

      - name: Verify retained tarball after release checks
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node ./scripts/release-artifact.mjs verify --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"

      - name: Verify authoritative generic tarball after release checks
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node ./scripts/release-artifact.mjs verify --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"

      - name: Verify release preparation restored tagged source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .

      - name: Generate deterministic release SBOM and evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          node ./scripts/release-sbom.mjs generate \
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \
            --source-date-epoch "$source_date_epoch" \
            --output-env-file "$GITHUB_ENV"

      - name: Verify deterministic release evidence
        run: node ./scripts/release-sbom.mjs verify --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"

      - name: Attest exact release tarball provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: ${{ env.RELEASE_TARBALL_PATH }}
          show-summary: false

      - name: Attest exact release SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: ${{ env.RELEASE_TARBALL_PATH }}
          sbom-path: ${{ env.RELEASE_SBOM_PATH }}
          show-summary: false

      - name: Attest retained release evidence manifests
        id: attest-evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: |
            ${{ env.RELEASE_ARTIFACT_MANIFEST_PATH }}
            ${{ env.RELEASE_EVIDENCE_MANIFEST_PATH }}
          show-summary: false

      - name: Retain attestation bundles with the exact artifact closure
        shell: bash
        run: |
          set -euo pipefail
          cp -- "${{ steps.attest-provenance.outputs.bundle-path }}" \
            "$RELEASE_ARTIFACT_DIRECTORY/$RELEASE_TARBALL_BASENAME.provenance.sigstore.json"
          cp -- "${{ steps.attest-sbom.outputs.bundle-path }}" \
            "$RELEASE_ARTIFACT_DIRECTORY/$RELEASE_TARBALL_BASENAME.sbom.sigstore.json"
          cp -- "${{ steps.attest-evidence.outputs.bundle-path }}" \
            "$RELEASE_ARTIFACT_DIRECTORY/$RELEASE_TARBALL_BASENAME.evidence.sigstore.json"

      - name: Bind immutable wave to component evidence
        shell: bash
        run: |
          set -euo pipefail
          wave_name="release-wave-$RELEASE_WAVE_ID.json"
          cp -- "$RELEASE_WAVE_PATH" "$RELEASE_ARTIFACT_DIRECTORY/$wave_name"
          (cd "$RELEASE_ARTIFACT_DIRECTORY" && sha256sum "$wave_name" > "$wave_name.sha256")

      - name: Create deterministic durable release evidence archive
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          archive_dir="$RUNNER_TEMP/release-evidence-archive"
          archive_name="${RELEASE_COMPONENT}-v${RELEASE_PACKAGE_VERSION}.release-evidence.tar.gz"
          mkdir -p "$archive_dir"
          node ./scripts/release-evidence-archive.mjs create \
            --directory "$RELEASE_ARTIFACT_DIRECTORY" \
            --output "$archive_dir/$archive_name" \
            --source-date-epoch "$source_date_epoch" \
            --output-env-file "$GITHUB_ENV"

      - name: Upload retained release tarball
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ env.RELEASE_COMPONENT }}-${{ env.RELEASE_PACKAGE_VERSION }}
          path: |
            ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
            ${{ env.RELEASE_EVIDENCE_ARCHIVE_PATH }}
            ${{ env.RELEASE_EVIDENCE_ARCHIVE_CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload authoritative generic release tarball
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ env.RELEASE_COMPONENT }}-${{ env.RELEASE_PACKAGE_VERSION }}
          path: |
            ${{ env.RELEASE_ARTIFACT_DIRECTORY }}
            ${{ env.RELEASE_EVIDENCE_ARCHIVE_PATH }}
            ${{ env.RELEASE_EVIDENCE_ARCHIVE_CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Inspect immutable npm publication state
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/release-tooling/scripts/release-npm-state.mjs" inspect \
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \
            --output-env-file "$GITHUB_ENV"

      - name: Publish retained tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT == 'pi-snapshot-edit' || env.RELEASE_COMPONENT == 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          set -euo pipefail
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          case "$RELEASE_NPM_PUBLICATION_STATE" in
            absent)
              npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
              ;;
            exact)
              echo "npm already contains the exact immutable bytes; publication is a verified no-op."
              ;;
            mismatch)
              echo "npm contains different immutable bytes; refusing to overwrite $RELEASE_PACKAGE_NAME@$RELEASE_PACKAGE_VERSION." >&2
              exit 1
              ;;
            *)
              echo "Unknown npm publication state: $RELEASE_NPM_PUBLICATION_STATE" >&2
              exit 1
              ;;
          esac
          # npm registry reads lag writes by a few seconds; poll briefly so a
          # successful publication is not misread as absent.
          for attempt in 1 2 3 4 5 6; do
            if node "$GITHUB_WORKSPACE/release-tooling/scripts/release-npm-state.mjs" inspect \
              --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \
              --require exact; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              exit 1
            fi
            echo "npm publication not visible yet (attempt $attempt/6); retrying in 10s."
            sleep 10
          done


      - name: Publish generic package directory to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        # Pass --dry-run explicitly; newer npm does not honor the dry-run
        # environment form reliably. npm 12 also applies
        # the registry version guard during dry-runs, so treat that specific
        # rejection as advisory (the authoritative tarball step owns the
        # exact-byte publication decision).
        run: |
          set +e
          SMOKE_OUTPUT="$(npm publish --dry-run --provenance --access public --tag "$RELEASE_NPM_DIST_TAG" 2>&1)"
          SMOKE_STATUS=$?
          set -e
          printf '%s\n' "$SMOKE_OUTPUT"
          if [[ "$SMOKE_STATUS" -ne 0 ]] && ! grep -qi "previously published" <<<"$SMOKE_OUTPUT"; then
            exit "$SMOKE_STATUS"
          fi

      - name: Publish authoritative generic tarball to npm (OIDC + provenance)
        if: env.RELEASE_COMPONENT != 'pi-snapshot-edit' && env.RELEASE_COMPONENT != 'pi-modes'
        working-directory: ${{ env.RELEASE_PACKAGE_PATH }}
        env:
          NPM_CONFIG_BIN_LINKS: "false"
        run: |
          set -euo pipefail
          echo "$RELEASE_TARBALL_SHA256  $RELEASE_TARBALL_PATH" | sha256sum --check --status
          node "$GITHUB_WORKSPACE/scripts/release-artifact.mjs" verify \
            --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH"
          node "$GITHUB_WORKSPACE/scripts/release-sbom.mjs" verify \
            --evidence "$RELEASE_EVIDENCE_MANIFEST_PATH"
          case "$RELEASE_NPM_PUBLICATION_STATE" in
            absent)
              npm publish "$RELEASE_TARBALL_PATH" --provenance --access public --tag "$RELEASE_NPM_DIST_TAG"
              ;;
            exact)
              echo "npm already contains the exact immutable bytes; publication is a verified no-op."
              ;;
            mismatch)
              echo "npm contains different immutable bytes; refusing to overwrite $RELEASE_PACKAGE_NAME@$RELEASE_PACKAGE_VERSION." >&2
              exit 1
              ;;
            *)
              echo "Unknown npm publication state: $RELEASE_NPM_PUBLICATION_STATE" >&2
              exit 1
              ;;
          esac
          # npm registry reads lag writes by a few seconds; poll briefly so a
          # successful publication is not misread as absent.
          for attempt in 1 2 3 4 5 6; do
            if node "$GITHUB_WORKSPACE/release-tooling/scripts/release-npm-state.mjs" inspect \
              --manifest "$RELEASE_ARTIFACT_MANIFEST_PATH" \
              --require exact; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then
              exit 1
            fi
            echo "npm publication not visible yet (attempt $attempt/6); retrying in 10s."
            sleep 10
          done


  retain-github-release-evidence:
    needs: publish-npm
    if: ${{ needs.publish-npm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-npm.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.2"
          package-manager-cache: false

      - name: Download exact workflow release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.publish-npm.outputs.workflow_artifact }}
          path: ${{ runner.temp }}/release-evidence-download

      - name: Verify tag and downloaded durable evidence
        env:
          RELEASE_TAG: ${{ needs.publish-npm.outputs.release_tag }}
          ARCHIVE_NAME: ${{ needs.publish-npm.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          archive="$(find "$RUNNER_TEMP/release-evidence-download" -type f -name "$ARCHIVE_NAME" -print -quit)"
          test -n "$archive"
          checksum="$(find "$RUNNER_TEMP/release-evidence-download" -type f -name "$ARCHIVE_NAME.sha256" -print -quit)"
          test -n "$checksum"
          node ./scripts/release-evidence-archive.mjs verify \
            --archive "$archive" \
            --checksum "$checksum"
          {
            echo "REMOTE_ARCHIVE_PATH=$archive"
            echo "REMOTE_CHECKSUM_PATH=$checksum"
          } >> "$GITHUB_ENV"

      - name: Retain or verify immutable GitHub Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish-npm.outputs.release_tag }}
          ARCHIVE_NAME: ${{ needs.publish-npm.outputs.archive_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          archive_exists=false
          checksum_exists=false
          if grep -Fxq "$ARCHIVE_NAME" <<<"$assets"; then archive_exists=true; fi
          if grep -Fxq "$ARCHIVE_NAME.sha256" <<<"$assets"; then checksum_exists=true; fi

          existing="$RUNNER_TEMP/existing-release-evidence"
          mkdir -p "$existing"
          if [[ "$archive_exists" == true ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARCHIVE_NAME" --dir "$existing"
            cmp -- "$REMOTE_ARCHIVE_PATH" "$existing/$ARCHIVE_NAME" || {
              echo "Existing GitHub Release asset differs: $ARCHIVE_NAME" >&2
              exit 1
            }
          fi
          if [[ "$checksum_exists" == true ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ARCHIVE_NAME.sha256" --dir "$existing"
            cmp -- "$REMOTE_CHECKSUM_PATH" "$existing/$ARCHIVE_NAME.sha256" || {
              echo "Existing GitHub Release asset differs: $ARCHIVE_NAME.sha256" >&2
              exit 1
            }
          fi

          if [[ "$archive_exists" != true ]]; then
            gh release upload "$RELEASE_TAG" "$REMOTE_ARCHIVE_PATH" --repo "$GITHUB_REPOSITORY"
          fi
          if [[ "$checksum_exists" != true ]]; then
            gh release upload "$RELEASE_TAG" "$REMOTE_CHECKSUM_PATH" --repo "$GITHUB_REPOSITORY"
          fi

          verified="$RUNNER_TEMP/verified-release-evidence"
          mkdir -p "$verified"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE_NAME" --pattern "$ARCHIVE_NAME.sha256" --dir "$verified"
          cmp -- "$REMOTE_ARCHIVE_PATH" "$verified/$ARCHIVE_NAME" || {
            echo "Remote release evidence differs after retention: $ARCHIVE_NAME" >&2
            exit 1
          }
          cmp -- "$REMOTE_CHECKSUM_PATH" "$verified/$ARCHIVE_NAME.sha256" || {
            echo "Remote release evidence differs after retention: $ARCHIVE_NAME.sha256" >&2
            exit 1
          }
          node ./scripts/release-evidence-archive.mjs verify \
            --archive "$verified/$ARCHIVE_NAME" \
            --checksum "$verified/$ARCHIVE_NAME.sha256"
