name: compatibility-canary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Compatibility profile to execute
        required: false
        default: current
        type: choice
        options:
          - current
          - upgrade
      host_version:
        description: Exact Pi host version for the upgrade profile
        required: false
        type: string
      changelog_ref:
        description: Exact upstream review anchor for the upgrade profile
        required: false
        type: string
      scenario:
        description: Optional exact scenario id
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'current' }}
  cancel-in-progress: true

jobs:
  validate-policy:
    name: validate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
      - name: Install governed npm client
        run: npm install --global npm@12.0.2
      - name: Validate compatibility policy and runner contract
        run: npm exec --yes --package=tsx@4.20.5 -- tsx scripts/pi-host-compat-canary.ts --list

  compatibility-canary:
    name: compatibility-canary
    needs: validate-policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PI_HOST_COMPAT_PROFILE: ${{ inputs.profile || 'current' }}
      PI_HOST_COMPAT_HOST_VERSION: ${{ inputs.host_version || '' }}
      PI_HOST_COMPAT_CHANGELOG_REF: ${{ inputs.changelog_ref || '' }}
      PI_HOST_COMPAT_SCENARIO: ${{ inputs.scenario || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
      - name: Install governed npm client
        run: npm install --global npm@12.0.2
      - name: Validate requested profile input
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PI_HOST_COMPAT_PROFILE" == "upgrade" ]]; then
            if [[ -z "$PI_HOST_COMPAT_HOST_VERSION" || -z "$PI_HOST_COMPAT_CHANGELOG_REF" ]]; then
              echo "The upgrade profile requires both host_version and changelog_ref inputs." >&2
              exit 1
            fi
          fi
      - name: Run exact Pi host compatibility canary
        run: |
          args=(--profile "$PI_HOST_COMPAT_PROFILE")
          if [[ -n "$PI_HOST_COMPAT_SCENARIO" ]]; then
            args+=(--scenario "$PI_HOST_COMPAT_SCENARIO")
          fi
          npm exec --yes --package=tsx@4.20.5 -- tsx scripts/pi-host-compat-canary.ts "${args[@]}"
