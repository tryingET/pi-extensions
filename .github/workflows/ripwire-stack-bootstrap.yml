name: Ripwire stack evaluation sources
on:
  push:
    branches: [work/context-packer-ripwire-bootstrap]
    paths: [.github/workflows/ripwire-stack-bootstrap.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: redhat-et/ripwire
          ref: 93c8edaafdb5499e89939cc2cebd0429e278e86f
          path: ripwire
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Aider-AI/aider
          ref: 5dc9490bb35f9729ef2c95d00a19ccd30c26339c
          path: aider
          fetch-depth: 1
          persist-credentials: false
      - name: Export pinned public source snapshots
        run: |
          git -C ripwire archive --format=tar HEAD | gzip > "$RUNNER_TEMP/ripwire-source.tar.gz"
          git -C ripwire rev-parse HEAD > "$RUNNER_TEMP/ripwire-source.sha"
          git -C aider archive --format=tar HEAD | gzip > "$RUNNER_TEMP/aider-source.tar.gz"
          git -C aider rev-parse HEAD > "$RUNNER_TEMP/aider-source.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: ripwire-evaluation-sources
          path: |
            ${{ runner.temp }}/ripwire-source.tar.gz
            ${{ runner.temp }}/ripwire-source.sha
            ${{ runner.temp }}/aider-source.tar.gz
            ${{ runner.temp }}/aider-source.sha
          retention-days: 3
